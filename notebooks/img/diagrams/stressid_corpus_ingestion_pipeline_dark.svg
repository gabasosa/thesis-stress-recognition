<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#050914"/>
    <stop offset="62%" stop-color="#071324"/>
    <stop offset="100%" stop-color="#151125"/>
  </linearGradient>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.24"/>
  </filter>
  <marker id="arrowGrey" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L12,6 L0,12 z" fill="#a9b4c6"/>
  </marker>
  <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L12,6 L0,12 z" fill="#10d8ee"/>
  </marker>
</defs>
<rect width="1600" height="960" fill="url(#bgGrad)"/>
<rect x="40" y="40" width="1520" height="890" rx="28" fill="#091120" stroke="#2b3a52" stroke-width="1.8" filter="url(#softShadow)"/>

<!-- Section labels -->
<text x="90" y="92" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#a9b4c6" letter-spacing="5">DATASET SOURCES</text>
<text x="655" y="92" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#a9b4c6" letter-spacing="5">PROCESSING PIPELINE</text>

<!-- Top panels -->
<rect x="70" y="118" width="500" height="370" rx="20" fill="#0c1526" stroke="#34455f" stroke-width="1.6"/>
<rect x="625" y="118" width="865" height="475" rx="20" fill="#0c1526" stroke="#34455f" stroke-width="1.6"/>

<!-- Dataset sources -->
<rect x="95" y="145" width="450" height="55" rx="18" fill="#111c2f" stroke="#34455f" stroke-width="1.4"/>
<text x="320" y="181" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#e8edf5" text-anchor="middle">StressID dataset root</text>

<rect x="105" y="230" width="420" height="78" rx="16" fill="#0e1b33" stroke="#2563eb" stroke-width="1.4"/>
<rect x="129" y="260" width="26" height="26" rx="6" fill="#142138" stroke="#2563eb" stroke-width="1.4"/>
<text x="175" y="267" font-family="IBM Plex Mono, Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#e8edf5">labels.csv</text>
<text x="175" y="296" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#c7d0df">metadata and binary stress labels</text>

<rect x="105" y="336" width="420" height="78" rx="16" fill="#0c1627" stroke="#34455f" stroke-width="1.4"/>
<rect x="129" y="366" width="26" height="26" rx="6" fill="#142138" stroke="#56657a" stroke-width="1.4"/>
<text x="175" y="373" font-family="IBM Plex Mono, Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#e8edf5">Audio/&lt;subject&gt;/*.wav</text>
<text x="175" y="402" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#c7d0df">speech recordings organized by subject</text>

<text x="155" y="462" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#a9b4c6">Root path:</text>
<text x="250" y="462" font-family="IBM Plex Mono, Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#e8edf5">STRESSID_ROOT</text>

<!-- Processing pipeline cards -->
<rect x="675" y="150" width="765" height="76" rx="14" fill="#101a2c" stroke="#34455f" stroke-width="1.5"/>
<circle cx="711" cy="188" r="22" fill="#092033" stroke="#37a6ff" stroke-width="2"/>
<text x="711" y="195" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#cbe7ff" text-anchor="middle">1</text>
<text x="753" y="182" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#e8edf5">Parse metadata</text>
<text x="753" y="208" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#c9d2e1">Split subject/task into subject and task.</text>

<rect x="675" y="260" width="765" height="76" rx="14" fill="#101a2c" stroke="#34455f" stroke-width="1.5"/>
<circle cx="711" cy="298" r="22" fill="#092033" stroke="#37a6ff" stroke-width="2"/>
<text x="711" y="305" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#cbe7ff" text-anchor="middle">2</text>
<text x="753" y="292" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#e8edf5">Resolve audio paths</text>
<text x="753" y="318" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#c9d2e1">Reconstruct each expected .wav location.</text>

<rect x="675" y="370" width="765" height="76" rx="14" fill="#101a2c" stroke="#34455f" stroke-width="1.5"/>
<circle cx="711" cy="408" r="22" fill="#092033" stroke="#37a6ff" stroke-width="2"/>
<text x="711" y="415" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#cbe7ff" text-anchor="middle">3</text>
<text x="753" y="402" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#e8edf5">Apply corpus filters</text>
<text x="753" y="428" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#c9d2e1">Keep speech tasks and remove known technical-failure recordings.</text>

<rect x="675" y="480" width="765" height="76" rx="14" fill="#09222c" stroke="#10d8ee" stroke-width="1.5"/>
<circle cx="711" cy="518" r="22" fill="#092033" stroke="#10d8ee" stroke-width="2"/>
<text x="711" y="525" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#cbe7ff" text-anchor="middle">4</text>
<text x="753" y="512" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#e8edf5">Build df_sid</text>
<text x="753" y="538" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#c9d2e1">One row per retained speech recording.</text>

<!-- Source-to-pipeline connectors: separated lanes -->
<path d="M525 269 C575 269, 596 188, 675 188" fill="none" stroke="#a9b4c6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGrey)" opacity="0.95"/>
<path d="M525 375 C575 375, 596 298, 675 298" fill="none" stroke="#a9b4c6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGrey)" opacity="0.95"/>

<!-- Internal pipeline arrows with longer vertical gaps -->
<path d="M1057 226 L1057 252" fill="none" stroke="#a9b4c6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGrey)"/>
<path d="M1057 336 L1057 362" fill="none" stroke="#a9b4c6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGrey)"/>
<path d="M1057 446 L1057 472" fill="none" stroke="#10d8ee" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"/>

<!-- Output table -->
<text x="90" y="625" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#a9b4c6" letter-spacing="5">OUTPUT TABLE</text>
<rect x="70" y="645" width="1480" height="180" rx="20" fill="#0c1526" stroke="#34455f" stroke-width="1.6"/>
<path d="M1057 556 L1057 635" fill="none" stroke="#10d8ee" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"/>

<rect x="105" y="675" width="330" height="64" rx="16" fill="#09222c" stroke="#10d8ee" stroke-width="1.6"/>
<text x="270" y="706" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#e8edf5" text-anchor="middle">Working dataframe</text>
<text x="270" y="729" font-family="IBM Plex Mono, Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#c8f7ff" text-anchor="middle">df_sid</text>

<text x="470" y="684" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#a9b4c6">Example resulting row</text>
<rect x="470" y="700" width="1035" height="86" rx="12" fill="#0a1221" stroke="#34455f" stroke-width="1.4"/>
<path d="M482,700 H1493 Q1505,700 1505,712 V738 H470 V712 Q470,700 482,700 Z" fill="#101b2e"/>
<line x1="470" y1="738" x2="1505" y2="738" stroke="#34455f" stroke-width="1.3"/>
<line x1="1110" y1="700" x2="1110" y2="786" stroke="#34455f" stroke-width="1.3"/>
<line x1="1245" y1="700" x2="1245" y2="786" stroke="#34455f" stroke-width="1.3"/>
<line x1="1400" y1="700" x2="1400" y2="786" stroke="#34455f" stroke-width="1.3"/>
<text x="490" y="727" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#a9b4c6">filepath</text>
<text x="1130" y="727" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#a9b4c6">subject</text>
<text x="1265" y="727" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#a9b4c6">task</text>
<text x="1452.5" y="727" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#a9b4c6" text-anchor="middle">binary-stress</text>
<text x="490" y="771" font-family="IBM Plex Mono, Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#e8edf5">STRESSID_ROOT/Audio/p01a/p01a_Reading.wav</text>
<text x="1130" y="772" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#e8edf5">p01a</text>
<text x="1265" y="772" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#e8edf5">Reading</text>
<text x="1452.5" y="772" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#e8edf5" text-anchor="middle">1</text>
<text x="470" y="812" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#a9b4c6">The row is retained only after task filtering and technical-issue exclusion.</text>

<!-- Policy strip -->
<rect x="70" y="838" width="1480" height="82" rx="18" fill="#101827" stroke="#34455f" stroke-width="1.4"/>
<circle cx="125" cy="879" r="29" fill="#0b1d33" stroke="#2563eb" stroke-width="2"/>
<path d="M111 880 L122 891 L143 866" fill="none" stroke="#37a6ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="175" y="870" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#e8edf5">Speech-task whitelist</text>
<text x="175" y="899" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#c4cede">Counting1, Counting2, Counting3, Math, Stroop, Reading, Speaking</text>
<line x1="795" y1="855" x2="795" y2="906" stroke="#34455f" stroke-width="1.3"/>
<circle cx="865" cy="879" r="29" fill="#171732" stroke="#a970ff" stroke-width="2"/>
<path d="M865 860 L881 868 V881 C881 893 872 900 865 903 C858 900 849 893 849 881 V868 Z" fill="none" stroke="#a970ff" stroke-width="2.5"/>
<path d="M865 869 V889 M855 879 H875" stroke="#a970ff" stroke-width="2.5" stroke-linecap="round"/>
<text x="920" y="870" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#e8edf5">Technical-issue blacklist</text>
<text x="920" y="895" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#c4cede">
  <tspan x="920" dy="0">Defined in Section 1.1 from faulty recording IDs</tspan>
  <tspan x="920" dy="18">documented in Technical information.pdf</tspan>
</text>
<path d="M1390 930 L1560 930 L1506 808 Z" fill="#1c1530" opacity="0.42"/>
</svg>
