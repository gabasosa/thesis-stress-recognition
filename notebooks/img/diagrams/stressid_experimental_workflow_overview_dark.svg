<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1660" viewBox="0 0 1280 1660">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#050914"/>
    <stop offset="100%" stop-color="#101321"/>
  </linearGradient>

  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
  </filter>

  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9.5" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9FB0C7"/>
  </marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9.5" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="#38BDF8"/>
  </marker>
  <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9.5" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="#A970FF"/>
  </marker>

  <style>
    .title { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 30px; font-weight: 800; fill: #F8FAFC; }
    .subtitle { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 17px; font-weight: 500; fill: #B8C4D4; }
    .cardTitle { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 23px; font-weight: 780; fill: #F1F5F9; }
    .cardBody { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 18px; font-weight: 480; fill: #C7D2E1; }
    .branchTitle { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 25px; font-weight: 800; fill: #F8FAFC; }
    .smallTitle { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 18px; font-weight: 760; fill: #EAF0F7; }
    .smallBody { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 15px; font-weight: 470; fill: #B8C4D4; }
    .sectionLabel { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 15px; font-weight: 800; letter-spacing: 0.12em; fill: #9FAEC3; }
  </style>
</defs>

<!-- Background -->
<rect width="1280" height="1660" fill="url(#bg)"/>
<rect x="36" y="34" width="1208" height="1592" rx="30"
      fill="#0A1220" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>

<!-- Header -->
<text x="640" y="82" text-anchor="middle" class="title">Experimental workflow</text>
<text x="640" y="112" text-anchor="middle" class="subtitle">
  Shared StressID data foundation, two representation branches, common evaluation protocols
</text>

<!-- Corpus -->
<rect x="390" y="150" width="500" height="100" rx="20"
      fill="#111827" stroke="#3B82F6" stroke-width="2"/>
<text x="640" y="191" text-anchor="middle" class="cardTitle">StressID corpus</text>
<text x="640" y="216" text-anchor="middle" class="cardBody">Speech recordings • metadata</text>
<text x="640" y="241" text-anchor="middle" class="smallBody">subject IDs • binary stress labels</text>

<!-- Ingestion -->
<path d="M640 250 V290" fill="none" stroke="#9FB0C7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>

<rect x="390" y="305" width="500" height="100" rx="20"
      fill="#111827" stroke="#3B82F6" stroke-width="2"/>
<text x="640" y="346" text-anchor="middle" class="cardTitle">Corpus ingestion &amp; filtering</text>
<text x="640" y="377" text-anchor="middle" class="cardBody">
  Shared recording selection for both pipelines
</text>

<!-- Split -->
<path d="M640 405 V455" fill="none" stroke="#9FB0C7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M640 455 H330 V515" fill="none" stroke="#9FB0C7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M640 455 H950 V515" fill="none" stroke="#38BDF8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"/>

<!-- ================= HANDCRAFTED ================= -->
<rect x="80" y="515" width="500" height="795" rx="26"
      fill="#0F172A" stroke="#334155" stroke-width="2"/>

<text x="330" y="558" text-anchor="middle" class="branchTitle">Handcrafted-feature pipeline</text>

<!-- HC features -->
<rect x="115" y="595" width="430" height="105" rx="18"
      fill="#111827" stroke="#3B82F6" stroke-width="2"/>
<text x="330" y="633" text-anchor="middle" class="cardTitle">Handcrafted features</text>
<text x="330" y="666" text-anchor="middle" class="cardBody">StressID acoustic descriptors</text>
<text x="330" y="690" text-anchor="middle" class="smallBody">140-dimensional recording-level vector</text>

<path d="M330 700 V740" fill="none" stroke="#9FB0C7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>

<!-- HC classifiers -->
<rect x="115" y="755" width="430" height="95" rx="18"
      fill="#111827" stroke="#3B82F6" stroke-width="2"/>
<text x="330" y="793" text-anchor="middle" class="cardTitle">Classical classifiers</text>
<text x="330" y="826" text-anchor="middle" class="cardBody">RF • kNN • SVM • MLP</text>

<!-- HC evaluation split -->
<path d="M330 850 V895" fill="none" stroke="#9FB0C7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M330 895 H205 V945" fill="none" stroke="#9FB0C7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M330 895 H455 V945" fill="none" stroke="#9FB0C7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>

<rect x="105" y="945" width="200" height="105" rx="16"
      fill="#111827" stroke="#3B82F6" stroke-width="1.8"/>
<text x="205" y="982" text-anchor="middle" class="smallTitle">Recording-level</text>
<text x="205" y="1007" text-anchor="middle" class="smallTitle">evaluation</text>
<text x="205" y="1034" text-anchor="middle" class="smallBody">10 × random 80/20</text>

<rect x="355" y="945" width="200" height="105" rx="16"
      fill="#10231D" stroke="#59D185" stroke-width="1.8"/>
<text x="455" y="982" text-anchor="middle" class="smallTitle">Subject-independent</text>
<text x="455" y="1007" text-anchor="middle" class="smallTitle">evaluation</text>
<text x="455" y="1034" text-anchor="middle" class="smallBody">GroupKFold by subject</text>

<!-- HC additional analyses -->
<path d="M455 1050 V1110" fill="none" stroke="#A970FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowPurple)"/>

<rect x="105" y="1110" width="450" height="165" rx="18"
      fill="#1A1630" stroke="#7651A8" stroke-width="2"/>
<text x="330" y="1143" text-anchor="middle" class="sectionLabel">ADDITIONAL HANDCRAFTED ANALYSES</text>

<text x="135" y="1178" class="smallTitle">• K-fold sensitivity</text>
<text x="135" y="1205" class="smallTitle">• XGBoost + Optuna</text>
<text x="135" y="1232" class="smallTitle">• Post-selection evaluation</text>
<text x="135" y="1259" class="smallTitle">• Nested GroupKFold + feature importance</text>

<!-- ================= WAV2VEC ================= -->
<rect x="700" y="515" width="500" height="795" rx="26"
      fill="#0F172A" stroke="#334155" stroke-width="2"/>

<text x="950" y="558" text-anchor="middle" class="branchTitle">Wav2Vec pipeline</text>

<!-- W2V features -->
<rect x="735" y="595" width="430" height="105" rx="18"
      fill="#111827" stroke="#22D3EE" stroke-width="2"/>
<text x="950" y="633" text-anchor="middle" class="cardTitle">Wav2Vec features</text>
<text x="950" y="666" text-anchor="middle" class="cardBody">Pretrained Fairseq wav2vec</text>
<text x="950" y="690" text-anchor="middle" class="smallBody">Temporal mean + standard deviation pooling</text>

<path d="M950 700 V740" fill="none" stroke="#9FB0C7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>

<!-- W2V classifiers -->
<rect x="735" y="755" width="430" height="95" rx="18"
      fill="#111827" stroke="#22D3EE" stroke-width="2"/>
<text x="950" y="793" text-anchor="middle" class="cardTitle">Classical classifiers</text>
<text x="950" y="826" text-anchor="middle" class="cardBody">RF • kNN • SVM • MLP</text>

<!-- W2V evaluation split -->
<path d="M950 850 V895" fill="none" stroke="#9FB0C7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M950 895 H825 V945" fill="none" stroke="#9FB0C7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M950 895 H1075 V945" fill="none" stroke="#9FB0C7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>

<rect x="725" y="945" width="200" height="105" rx="16"
      fill="#111827" stroke="#22D3EE" stroke-width="1.8"/>
<text x="825" y="982" text-anchor="middle" class="smallTitle">Recording-level</text>
<text x="825" y="1007" text-anchor="middle" class="smallTitle">evaluation</text>
<text x="825" y="1034" text-anchor="middle" class="smallBody">10 × random 80/20</text>

<rect x="975" y="945" width="200" height="105" rx="16"
      fill="#10231D" stroke="#59D185" stroke-width="1.8"/>
<text x="1075" y="982" text-anchor="middle" class="smallTitle">Subject-independent</text>
<text x="1075" y="1007" text-anchor="middle" class="smallTitle">evaluation</text>
<text x="1075" y="1034" text-anchor="middle" class="smallBody">GroupKFold by subject</text>

<path d="M825 1050 V1090 H950" fill="none" stroke="#9FB0C7" stroke-width="2.5"/>
<path d="M1075 1050 V1090 H950" fill="none" stroke="#9FB0C7" stroke-width="2.5"/>


<!-- Merge -->
<path d="M330 1310 V1360 H640" fill="none" stroke="#9FB0C7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M950 1310 V1360 H640" fill="none" stroke="#38BDF8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M640 1360 V1410" fill="none" stroke="#38BDF8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"/>

<!-- Comparative -->
<rect x="390" y="1410" width="500" height="100" rx="20"
      fill="#10231D" stroke="#59D185" stroke-width="2"/>
<text x="640" y="1450" text-anchor="middle" class="cardTitle">Comparative results</text>
<text x="640" y="1482" text-anchor="middle" class="cardBody">
  Recording-level and subject-independent summaries
</text>

<path d="M640 1510 V1560" fill="none" stroke="#9FB0C7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>

<!-- Export -->
<rect x="440" y="1560" width="400" height="70" rx="18"
      fill="#0B2029" stroke="#22D3EE" stroke-width="2"/>
<text x="640" y="1603" text-anchor="middle" class="cardTitle">Final table export</text>

</svg>